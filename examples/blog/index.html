<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Fleabox</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        
        h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }
        
        .subtitle {
            opacity: 0.9;
            font-size: 14px;
        }

        .public-url {
            margin-top: 15px;
            padding: 10px 15px;
            background: rgba(255,255,255,0.2);
            border-radius: 6px;
            font-size: 13px;
            word-break: break-all;
        }

        .public-url strong {
            display: block;
            margin-bottom: 5px;
        }

        .public-url a {
            color: white;
            text-decoration: underline;
        }
        
        .tabs {
            display: flex;
            background: #f5f5f5;
            border-bottom: 1px solid #ddd;
        }
        
        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
        }
        
        .tab.active {
            background: white;
            color: #f5576c;
            border-bottom: 2px solid #f5576c;
        }
        
        .content {
            padding: 30px;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }
        
        .success {
            background: #efe;
            color: #3c3;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #f5576c;
        }
        
        textarea {
            min-height: 200px;
            resize: vertical;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        button {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(245, 87, 108, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .btn-secondary {
            background: #6c757d;
            margin-left: 10px;
        }
        
        .btn-danger {
            background: #dc3545;
        }
        
        .posts-list {
            display: grid;
            gap: 20px;
        }
        
        .post-item {
            border: 2px solid #eee;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s;
        }
        
        .post-item:hover {
            border-color: #f5576c;
            box-shadow: 0 4px 12px rgba(245, 87, 108, 0.1);
        }
        
        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }
        
        .post-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        
        .post-date {
            font-size: 12px;
            color: #999;
        }
        
        .post-status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .status-published {
            background: #d4edda;
            color: #155724;
        }
        
        .status-draft {
            background: #fff3cd;
            color: #856404;
        }
        
        .post-excerpt {
            color: #666;
            margin-bottom: 15px;
            line-height: 1.6;
        }
        
        .post-actions {
            display: flex;
            gap: 10px;
        }
        
        .post-actions button {
            padding: 8px 16px;
            font-size: 13px;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        
        .empty-state h3 {
            font-size: 20px;
            margin-bottom: 10px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 My Blog</h1>
            <div class="subtitle">Powered by Fleabox - Showcase for Public Folders</div>
            <div class="public-url" id="publicUrl" style="display: none;">
                <strong>Your public blog URL:</strong>
                <a href="#" target="_blank" id="publicLink"></a>
            </div>
        </header>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('posts')">My Posts</button>
            <button class="tab" onclick="switchTab('new')">New Post</button>
        </div>

        <div class="content">
            <div class="error" id="error"></div>
            <div class="success" id="success"></div>

            <!-- Posts List Tab -->
            <div class="tab-content active" id="postsTab">
                <div class="loading" id="loading">Loading posts...</div>
                <div class="posts-list" id="postsList"></div>
                <div class="empty-state" id="emptyState" style="display: none;">
                    <h3>No posts yet</h3>
                    <p>Create your first blog post to get started!</p>
                </div>
            </div>

            <!-- New Post Tab -->
            <div class="tab-content" id="newTab">
                <form id="postForm" onsubmit="savePost(event)">
                    <div class="form-group">
                        <label for="postTitle">Title *</label>
                        <input type="text" id="postTitle" required placeholder="Enter post title">
                    </div>

                    <div class="form-group">
                        <label for="postContent">Content *</label>
                        <textarea id="postContent" required placeholder="Write your blog post content here... (Markdown supported)"></textarea>
                    </div>

                    <div class="form-group">
                        <div class="checkbox-group">
                            <input type="checkbox" id="publishPost" checked>
                            <label for="publishPost" style="margin-bottom: 0;">Publish to public folder (make it publicly accessible)</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <button type="submit">Save Post</button>
                        <button type="button" class="btn-secondary" onclick="cancelEdit()">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/blog';
        let currentEditId = null;
        let username = null;

        // Get current username from login
        async function getUsername() {
            if (username) return username;
            
            // Try to extract from any API call or use a default
            // In a real app, this would come from auth
            try {
                const response = await fetch(`${API_BASE}/data/.username`, {
                    method: 'PUT',
                    body: 'init'
                });
                
                // For dev mode, we can use a default username
                username = 'vscode'; // This will be the actual system username
                return username;
            } catch (error) {
                username = 'vscode';
                return username;
            }
        }

        // Initialize on load
        window.addEventListener('load', async () => {
            await getUsername();
            loadPosts();
            updatePublicUrl();
        });

        function updatePublicUrl() {
            const publicUrlDiv = document.getElementById('publicUrl');
            const publicLink = document.getElementById('publicLink');
            const url = `${window.location.origin}/blog/~${username}/`;
            
            publicLink.href = url;
            publicLink.textContent = url;
            publicUrlDiv.style.display = 'block';
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            
            if (tab === 'posts') {
                document.querySelector('.tab:nth-child(1)').classList.add('active');
                document.getElementById('postsTab').classList.add('active');
                loadPosts();
            } else {
                document.querySelector('.tab:nth-child(2)').classList.add('active');
                document.getElementById('newTab').classList.add('active');
                if (currentEditId) {
                    currentEditId = null;
                    document.getElementById('postForm').reset();
                    document.getElementById('publishPost').checked = true;
                }
            }
            
            hideMessages();
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => errorDiv.style.display = 'none', 5000);
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('success');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            setTimeout(() => successDiv.style.display = 'none', 3000);
        }

        function hideMessages() {
            document.getElementById('error').style.display = 'none';
            document.getElementById('success').style.display = 'none';
        }

        async function loadPosts() {
            const loading = document.getElementById('loading');
            const postsList = document.getElementById('postsList');
            const emptyState = document.getElementById('emptyState');
            
            loading.style.display = 'block';
            postsList.innerHTML = '';
            emptyState.style.display = 'none';
            
            try {
                // Load posts from private data folder
                const response = await fetch(`${API_BASE}/data/posts`);
                
                if (response.status === 404) {
                    loading.style.display = 'none';
                    emptyState.style.display = 'block';
                    return;
                }
                
                if (!response.ok) {
                    throw new Error('Failed to load posts');
                }
                
                const files = await response.json();
                const posts = [];
                
                // Load each post
                for (const file of files) {
                    if (file.type === 'file' && file.name.endsWith('.json')) {
                        const postResponse = await fetch(`${API_BASE}/data/posts/${file.name}`);
                        if (postResponse.ok) {
                            const post = await postResponse.json();
                            post.id = file.name.replace('.json', '');
                            posts.push(post);
                        }
                    }
                }
                
                loading.style.display = 'none';
                
                if (posts.length === 0) {
                    emptyState.style.display = 'block';
                    return;
                }
                
                // Sort by date (newest first)
                posts.sort((a, b) => new Date(b.date) - new Date(a.date));
                
                posts.forEach(post => {
                    const postElement = createPostElement(post);
                    postsList.appendChild(postElement);
                });
                
            } catch (error) {
                loading.style.display = 'none';
                showError('Failed to load posts: ' + error.message);
            }
        }

        function createPostElement(post) {
            const div = document.createElement('div');
            div.className = 'post-item';
            
            const excerpt = post.content.substring(0, 200) + (post.content.length > 200 ? '...' : '');
            const date = new Date(post.date).toLocaleDateString('en-US', { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
            
            div.innerHTML = `
                <div class="post-header">
                    <div>
                        <div class="post-title">${escapeHtml(post.title)}</div>
                        <div class="post-date">${date}</div>
                    </div>
                    <div class="post-status status-${post.published ? 'published' : 'draft'}">
                        ${post.published ? 'Published' : 'Draft'}
                    </div>
                </div>
                <div class="post-excerpt">${escapeHtml(excerpt)}</div>
                <div class="post-actions">
                    <button onclick="editPost('${post.id}')">Edit</button>
                    ${post.published ? `<button onclick="viewPublic('${post.id}')">View Public</button>` : ''}
                    ${post.published ? `<button onclick="unpublishPost('${post.id}')">Unpublish</button>` : `<button onclick="publishPost('${post.id}')">Publish</button>`}
                    <button class="btn-danger" onclick="deletePost('${post.id}')">Delete</button>
                </div>
            `;
            
            return div;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function savePost(event) {
            event.preventDefault();
            
            const title = document.getElementById('postTitle').value;
            const content = document.getElementById('postContent').value;
            const shouldPublish = document.getElementById('publishPost').checked;
            
            const post = {
                title,
                content,
                date: new Date().toISOString(),
                published: shouldPublish
            };
            
            try {
                const postId = currentEditId || generateId();
                
                // Save to private data folder
                const response = await fetch(`${API_BASE}/data/posts/${postId}.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(post)
                });
                
                if (!response.ok) {
                    throw new Error('Failed to save post');
                }
                
                // If publishing, also save to public folder
                if (shouldPublish) {
                    await publishPostToPublic(postId, post);
                } else if (currentEditId) {
                    // If unpublishing an existing post, remove from public
                    await unpublishPostFromPublic(postId);
                }
                
                showSuccess(currentEditId ? 'Post updated successfully!' : 'Post created successfully!');
                document.getElementById('postForm').reset();
                document.getElementById('publishPost').checked = true;
                currentEditId = null;
                
                setTimeout(() => switchTab('posts'), 1000);
                
            } catch (error) {
                showError('Failed to save post: ' + error.message);
            }
        }

        async function publishPostToPublic(postId, post) {
            // Create a simple HTML page for the post
            const html = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${escapeHtml(post.title)}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
            color: #333;
        }
        h1 {
            color: #f5576c;
            margin-bottom: 10px;
        }
        .date {
            color: #999;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .content {
            white-space: pre-wrap;
        }
        .back {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .back a {
            color: #f5576c;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <h1>${escapeHtml(post.title)}</h1>
    <div class="date">${new Date(post.date).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })}</div>
    <div class="content">${escapeHtml(post.content)}</div>
    <div class="back">
        <a href="../">← Back to blog</a>
    </div>
</body>
</html>`;
            
            const response = await fetch(`${API_BASE}/public/${postId}.html`, {
                method: 'PUT',
                body: html
            });
            
            if (!response.ok) {
                throw new Error('Failed to publish post');
            }
            
            // Update index.html in public folder
            await updatePublicIndex();
        }

        async function unpublishPostFromPublic(postId) {
            try {
                await fetch(`${API_BASE}/public/${postId}.html`, {
                    method: 'DELETE'
                });
                await updatePublicIndex();
            } catch (error) {
                console.error('Failed to unpublish:', error);
            }
        }

        async function updatePublicIndex() {
            // Load all published posts
            const response = await fetch(`${API_BASE}/data/posts`);
            if (!response.ok) return;
            
            const files = await response.json();
            const posts = [];
            
            for (const file of files) {
                if (file.type === 'file' && file.name.endsWith('.json')) {
                    const postResponse = await fetch(`${API_BASE}/data/posts/${file.name}`);
                    if (postResponse.ok) {
                        const post = await postResponse.json();
                        if (post.published) {
                            post.id = file.name.replace('.json', '');
                            posts.push(post);
                        }
                    }
                }
            }
            
            // Sort by date (newest first)
            posts.sort((a, b) => new Date(b.date) - new Date(a.date));
            
            // Generate index.html
            const html = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
            color: #333;
        }
        h1 {
            color: #f5576c;
            margin-bottom: 40px;
        }
        .post {
            margin-bottom: 40px;
            padding-bottom: 40px;
            border-bottom: 1px solid #eee;
        }
        .post:last-child {
            border-bottom: none;
        }
        .post h2 {
            margin-bottom: 10px;
        }
        .post h2 a {
            color: #333;
            text-decoration: none;
        }
        .post h2 a:hover {
            color: #f5576c;
        }
        .date {
            color: #999;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .excerpt {
            color: #666;
        }
        .empty {
            text-align: center;
            color: #999;
            padding: 60px 20px;
        }
    </style>
</head>
<body>
    <h1>📝 My Blog</h1>
    ${posts.length > 0 ? posts.map(post => `
        <div class="post">
            <h2><a href="${post.id}.html">${escapeHtml(post.title)}</a></h2>
            <div class="date">${new Date(post.date).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })}</div>
            <div class="excerpt">${escapeHtml(post.content.substring(0, 200))}${post.content.length > 200 ? '...' : ''}</div>
        </div>
    `).join('') : '<div class="empty">No posts yet.</div>'}
</body>
</html>`;
            
            await fetch(`${API_BASE}/public/index.html`, {
                method: 'PUT',
                body: html
            });
        }

        async function editPost(postId) {
            try {
                const response = await fetch(`${API_BASE}/data/posts/${postId}.json`);
                if (!response.ok) {
                    throw new Error('Failed to load post');
                }
                
                const post = await response.json();
                
                document.getElementById('postTitle').value = post.title;
                document.getElementById('postContent').value = post.content;
                document.getElementById('publishPost').checked = post.published;
                
                currentEditId = postId;
                switchTab('new');
                
            } catch (error) {
                showError('Failed to load post: ' + error.message);
            }
        }

        async function deletePost(postId) {
            if (!confirm('Are you sure you want to delete this post?')) {
                return;
            }
            
            try {
                // Delete from private folder
                await fetch(`${API_BASE}/data/posts/${postId}.json`, {
                    method: 'DELETE'
                });
                
                // Delete from public folder if exists
                await fetch(`${API_BASE}/public/${postId}.html`, {
                    method: 'DELETE'
                });
                
                await updatePublicIndex();
                
                showSuccess('Post deleted successfully!');
                loadPosts();
                
            } catch (error) {
                showError('Failed to delete post: ' + error.message);
            }
        }

        async function publishPost(postId) {
            try {
                const response = await fetch(`${API_BASE}/data/posts/${postId}.json`);
                const post = await response.json();
                post.published = true;
                
                await fetch(`${API_BASE}/data/posts/${postId}.json`, {
                    method: 'PUT',
                    body: JSON.stringify(post)
                });
                
                await publishPostToPublic(postId, post);
                
                showSuccess('Post published successfully!');
                loadPosts();
                
            } catch (error) {
                showError('Failed to publish post: ' + error.message);
            }
        }

        async function unpublishPost(postId) {
            try {
                const response = await fetch(`${API_BASE}/data/posts/${postId}.json`);
                const post = await response.json();
                post.published = false;
                
                await fetch(`${API_BASE}/data/posts/${postId}.json`, {
                    method: 'PUT',
                    body: JSON.stringify(post)
                });
                
                await unpublishPostFromPublic(postId);
                
                showSuccess('Post unpublished successfully!');
                loadPosts();
                
            } catch (error) {
                showError('Failed to unpublish post: ' + error.message);
            }
        }

        function viewPublic(postId) {
            window.open(`/blog/~${username}/${postId}.html`, '_blank');
        }

        function cancelEdit() {
            if (currentEditId) {
                currentEditId = null;
                document.getElementById('postForm').reset();
                document.getElementById('publishPost').checked = true;
            }
            switchTab('posts');
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }
    </script>
</body>
</html>
